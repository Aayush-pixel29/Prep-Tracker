<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PrepScraper Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="options">
    <h1>⚙️ PrepScraper Settings</h1>
    <p class="subtitle">Configure your Chrome extension and desktop app connection.</p>

    <div class="section">
      <h2>Connection</h2>
      <div class="field">
        <label>Desktop App API Port</label>
        <input type="number" id="apiPort" value="3847" />
        <small>Default: 3847. Change only if your desktop app uses a different port.</small>
      </div>
      <div class="field">
        <label>
          <input type="checkbox" id="autoSync" checked />
          Auto-sync when visiting coding platforms
        </label>
      </div>
      <div class="field">
        <label>Sync Interval (minutes)</label>
        <input type="number" id="syncInterval" value="30" min="5" max="120" />
      </div>
    </div>

    <div class="section">
      <h2>Platform Usernames</h2>
      <div class="field">
        <label>LeetCode Username</label>
        <input type="text" id="leetcodeUsername" placeholder="your-leetcode-username" />
      </div>
      <div class="field">
        <label>NeetCode Username</label>
        <input type="text" id="neetcodeUsername" placeholder="your-neetcode-username" />
      </div>
      <div class="field">
        <label>HackerRank Username</label>
        <input type="text" id="hackerrankUsername" placeholder="your-hackerrank-username" />
      </div>
      <div class="field">
        <label>GeeksForGeeks Username</label>
        <input type="text" id="gfgUsername" placeholder="your-gfg-username" />
      </div>
    </div>

    <button id="saveBtn" class="save-btn">💾 Save Settings</button>
    <div id="saveStatus" class="save-status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
